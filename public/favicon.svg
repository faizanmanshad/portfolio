<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    /* Default to dark color for light themes or when media queries aren't evaluated (e.g. Chrome New Tab page) */
    .line {
      fill: none;
      stroke: #101412;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .node {
      fill: #101412;
      stroke: none;
    }
    
    /* Switch to light color for dark themes */
    @media (prefers-color-scheme: dark) {
      .line {
        stroke: #EAEBEF;
      }
      .node {
        fill: #EAEBEF;
      }
    }
  </style>
  <path class="line" d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" />
  <path class="line" d="M10 30 L50 50 L90 30" />
  <path class="line" d="M50 50 L50 90" />
  <!-- Central node -->
  <circle class="node" cx="50" cy="50" r="6" />
  <!-- Outer nodes -->
  <circle class="node" cx="50" cy="10" r="4" />
  <circle class="node" cx="90" cy="30" r="4" />
  <circle class="node" cx="90" cy="70" r="4" />
  <circle class="node" cx="50" cy="90" r="4" />
  <circle class="node" cx="10" cy="70" r="4" />
  <circle class="node" cx="10" cy="30" r="4" />
</svg>
